<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria — Rangel Santos — Fotografia</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="/inicio" class="nav-logo" data-setting="site_name">Rangel <em>Santos</em> <span class="nav-logo-photo">Fotografia</span></a>
    <button class="nav-toggle" aria-label="Abrir menu"><span></span><span></span><span></span></button>
    <div class="nav-links">
      <a href="/inicio">Início</a>
      <a href="/galeria" class="active">Galeria</a>
      <a href="/sobre">Sobre</a>
      <a href="/contato">Contato</a>
      <a href="/area-cliente" class="nav-cta">Área do Cliente</a>
    </div>
  </div>
</nav>

<section class="section" style="padding-top:160px;">
  <div class="container">
    <div class="section-head">
      <div>
        <p class="section-eyebrow">Nossa</p>
        <h2 class="section-title">Galeria</h2>
      </div>
    </div>

    <div class="filters" id="gallery-filters">
  <button class="filter-btn active" data-filter="todas">
    Todas
  </button>
</div>

    <div class="grid" id="gallery-grid">
      <!-- Os cards de ensaio são desenhados aqui automaticamente pelo js/gallery.js -->
    </div>
  </div>
</section>

<!-- Visualizador em tela cheia (lightbox) -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-top">
    <div>
      <p class="lightbox-title" id="lightbox-title"></p>
      <p class="lightbox-counter" id="lightbox-counter"></p>
    </div>
    <button class="lightbox-close" id="lightbox-close" aria-label="Fechar visualizador">✕</button>
  </div>
  <button class="lightbox-arrow lightbox-arrow-left" id="lightbox-prev" aria-label="Foto anterior">‹</button>
  <div class="lightbox-stage" id="lightbox-stage"></div>
  <button class="lightbox-arrow lightbox-arrow-right" id="lightbox-next" aria-label="Próxima foto">›</button>
</div>

<footer class="footer">
  <div class="container">
    <span class="footer-mono" data-setting="footer_text">© 2026 Rangel Santos — Fotografia</span>
    <div class="footer-links footer-mono">
      <a href="https://instagram.com/photosrangel" target="_blank" rel="noopener" data-setting="instagram_url">Instagram</a>
      <a href="https://wa.me/351931159748" target="_blank" rel="noopener" data-setting="whatsapp">WhatsApp</a>
      <a href="/area-cliente">Área do Cliente</a>
    </div>
  </div>
</footer>

<script src="js/gallery-data.js"></script>
<script src="js/gallery.js"></script>
<script src="js/main.js"></script>
<script type="module">
  import { initSite } from './js/cms-config.js';
  initSite();
</script>
</body>
</html>
